<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        main: '#3b82f6',
      }
    }
  }
}
</script>
<style>
*{font-family: system-ui,-apple-system,Segoe UI,Roboto}
.card{transition: 0.25s ease;}
.card:hover{transform: translateY(-6px);box-shadow: 0 16px 30px rgba(59,130,246,0.18)}
</style>
</head>
<body class="bg-slate-5 min-h-screen">
<div class="max-w-xl mx-auto px-4 py-16">
  <div class="text-center mb-16">
    <h1 class="text-[clamp(2rem,6vw,3.2rem)] font-bold text-slate-800 mb-4">踏实履职，服务班级</h1>
    <p class="text-slate-500 text-lg">竞选团支部书记 & 学习委员</p >
  </div>
  <div class="grid md:grid-cols-3 gap-6">
    <a href=" " class=" card bg-white rounded-2xl p-8 shadow">
      <div class=" text-main text-3xl mb-3"><i class="fa fa-user"></i></div>
      <h2 class="font-bold text-xl mb-2">竞选自述</h2>
      <p class="text-slate-500">了解我的想法</p >
    </a >
    <a href="plan.html" class=" card bg-white rounded-2xl p-8 shadow">
      <div class=" text-main text-3xl mb-3"><i class="fa fa-lightbulb-o"></i></div>
      <h2 class="font-bold text-xl mb-2">我的优势与愿望</h2>
      <p class="text-slate-500">初心与目标</p >
    </a >
    <a href="vote.html" class=" card bg-white rounded-2xl p-8 shadow">
      <div class=" text-main text-3xl mb-3"><i class="fa fa-thumbs-up"></i></div>
      <h2 class="font-bold text-xl mb-2">投我一票</h2>
      <p class="text-slate-500">支持我吧</p >
    </a >
  </div>
</div>
</body>
</html>
